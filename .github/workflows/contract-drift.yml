# ABOUTME: Fails CI when src/types/api.ts (or an api/*.ts module's own types) drift from
# ABOUTME: the vendored openapi.json contract. Modeled on ivory's contract-drift.yml.

name: Contract Drift

on:
  push:
  pull_request:
    branches: [main]

jobs:
  drift:
    name: Types match openapi.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract-drift
