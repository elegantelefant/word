server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CORS headers for Office.js
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Correct MIME types
    include /etc/nginx/mime.types;
    types {
        application/xml xml;
        text/plain command bat;
    }

    # Manifest served at /manifest.xml
    location = /manifest.xml {
        alias /usr/share/nginx/html/manifest.xml;
        add_header Content-Type "application/xml" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Installer scripts — force download
    location ~ \.(command|bat)$ {
        add_header Content-Disposition "attachment" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA fallback — try file, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
