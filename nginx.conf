server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CORS headers for Office.js
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Restrict resources loaded by the Word task pane.
    # frame-ancestors (#85): the Microsoft 365 commercial-cloud pages that frame the pane and the Teams tab.
    #   Word for the web: the commercial entries of OfficeOnlineDomainList in the CDN office.js that
    #   index.html loads (word-web-16.00.js, fetched 2026-11-17; *.cloud.microsoft covers its
    #   *.office.svc/word/excel/powerpoint.cloud.microsoft), plus the document pages that frame them
    #   (*.sharepoint.com, onedrive.live.com), which Microsoft does not document.
    #   Teams, Microsoft 365 app, Outlook: learn.microsoft.com/microsoftteams/platform/tabs/how-to/tab-requirements
    #   Not covered: sovereign clouds (GCC High, DoD, 21Vianet) and SharePoint custom domains.
    #   Residual risk: *.sharepoint.com and *.cloud.microsoft include pages any tenant controls.
    #   Desktop Word hosts the pane in a webview; Microsoft does not say whether frame-ancestors applies there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://elefant.legal https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.officeapps.live.com https://*.office.guest.usercontent.microsoft https://*.sharepoint.com https://onedrive.live.com https://*.cloud.microsoft https://teams.microsoft.com https://*.teams.microsoft.com https://*.microsoft365.com https://*.office.com https://outlook.office.com https://outlook.office365.com https://outlook-sdf.office.com https://outlook-sdf.office365.com" always;
    # Correct MIME types
    include /etc/nginx/mime.types;
    types {
        application/xml xml;
        text/plain command bat;
    }

    # Manifest served at /manifest.xml
    location = /manifest.xml {
        alias /usr/share/nginx/html/manifest.xml;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The same manifest as a file download, for users who save it to upload or sideload (#86). /manifest.xml
    # stays as it is for the admin centre's manifest URL option, whose header rules Microsoft does not document.
    location = /manifest-download.xml {
        alias /usr/share/nginx/html/manifest.xml;
        add_header Content-Disposition 'attachment; filename="manifest.xml"' always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The Outlook add-in's production manifest, inline and as a file download, like the Word pair above.
    # The type comes from the server-level types block.
    location = /manifest-outlook.xml {
        alias /usr/share/nginx/html/manifest-outlook.xml;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /manifest-outlook-download.xml {
        alias /usr/share/nginx/html/manifest-outlook.xml;
        add_header Content-Disposition 'attachment; filename="manifest-outlook.xml"' always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Installer scripts — force download
    location ~ \.(command|bat)$ {
        add_header Content-Disposition "attachment" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA fallback — try file, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
