server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CORS headers for Office.js
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Restrict resources loaded by the Word task pane.
    # frame-ancestors: only Office and Teams hosts may embed the pane and the Teams tab (#85).
    #   Word for the web: office.js OfficeCore.OfficeOnlineDomainList (word-web-16.00.js), plus the
    #   document pages that frame it (*.sharepoint.com, onedrive.live.com; Microsoft does not document these).
    #   Teams, Microsoft 365 app, Outlook: learn.microsoft.com/microsoftteams/platform/tabs/how-to/tab-requirements.
    #   Desktop Word hosts the pane in a webview; Microsoft does not say whether frame-ancestors applies there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://elefant.legal https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.officeapps.live.com https://*.officeapps-df.live.com https://*.dod.online.office365.us https://*.gov.online.office365.us https://*.online.office.de https://*.partner.officewebapps.cn https://*.sharepoint.com https://onedrive.live.com https://*.cloud.microsoft https://teams.microsoft.com https://*.teams.microsoft.com https://*.microsoft365.com https://*.office.com https://outlook.office.com https://outlook.office365.com" always;
    # Correct MIME types
    include /etc/nginx/mime.types;
    types {
        application/xml xml;
        text/plain command bat;
    }

    # Manifest served at /manifest.xml
    location = /manifest.xml {
        alias /usr/share/nginx/html/manifest.xml;
        add_header Content-Type "application/xml" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Installer scripts — force download
    location ~ \.(command|bat)$ {
        add_header Content-Disposition "attachment" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA fallback — try file, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
